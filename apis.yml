name: Moven
description: 'Moven (Movencorp Newco Inc.) is a New York City fintech founded in 2011 by Brett King and Alex Sion.
  Originally a direct-to-consumer mobile banking and financial-wellness app, the company pivoted in 2020 to a
  business-to-business model, licensing its spending-analytics and financial-wellness technology to banks, credit
  unions, and other fintechs through open APIs and SDKs. Its data-driven engagement modules power companion and
  challenger-bank experiences such as TD Bank''s MySpend and Westpac''s CashNav. Moven''s API and SDK surface is
  partner-gated behind a demo/sandbox request rather than a self-serve public developer portal, so no public
  OpenAPI, reference documentation, or GitHub organization is available for catalog harvesting.'
